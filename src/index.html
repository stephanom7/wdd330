      <div class="hero">
        <img
          src="./images/banner-sm.jpg"
          srcset="./images/banner-sm.jpg 500w, ./images/banner.jpg"
          alt="image of a high mountain lake"
        />
      </div>

      <div class="mission">
        <p>
          Our mission is to provide you with everything you need to sleep
          outside comfortably at an affordable price.
        </p>
      </div>

      <section class="products">
        <h2>Top Products</h2>
        
        <div class="product-controls" style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin: 1.5rem 0; flex-wrap: wrap;">
          <div class="search-container" style="flex: 1; min-width: 200px;">
            <input 
              type="text" 
              id="search-input" 
              placeholder="Search products..." 
              style="width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem;"
            />
          </div>
          <div class="sort-container">
            <label for="sort-select">Sort by: </label>
            <select id="sort-select" style="padding: 8px; border-radius: 4px;">
              <option value="name">Name (A-Z)</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
            </select>
          </div>
        </div>
