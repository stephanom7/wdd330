<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      /* Style safety net to prevent giant SVG/Image layout bugs */
      img, svg {
        max-width: 100%;
        height: auto;
      }
      .logo img, header img {
        width: 60px !important;
        height: 60px !important;
      }
      .cart svg {
        width: 25px !important;
        height: auto !important;
      }
    </style>
  </head>
  <body>
    <header class="divider">
      <div class="logo">
        <a href="../index.html">
          <img src="../images/noun_Tent_2517.svg" alt="tent logo" style="width: 60px; height: 60px;" />
        </a>
        <a href="../index.html"> Sleep<span class="highlight">Outside</span></a>
      </div>
    </header>
    <main class="divider" style="padding: 1rem; max-width: 600px; margin: 0 auto;">
      <h2>Review & Place your Order</h2>
      <form id="checkout-form" style="margin-top: 1rem;">
        <fieldset style="padding: 1rem; margin-bottom: 1rem;">
          <legend>Shipping</legend>
          <label style="display:block; margin-bottom: 0.5rem;">
            First Name
            <input type="text" name="fname" required style="width: 100%; padding: 8px;" />
          </label>
          <label style="display:block; margin-bottom: 0.5rem;">
            Last Name
            <input type="text" name="lname" required style="width: 100%; padding: 8px;" />
          </label>
          <label style="display:block; margin-bottom: 0.5rem;">
            Street
            <input type="text" name="street" required style="width: 100%; padding: 8px;" />
          </label>
          <label style="display:block; margin-bottom: 0.5rem;">
            City
            <input type="text" name="city" required style="width: 100%; padding: 8px;" />
          </label>
          <label style="display:block; margin-bottom: 0.5rem;">
            State
            <input type="text" name="state" required style="width: 100%; padding: 8px;" />
          </label>
          <label style="display:block; margin-bottom: 0.5rem;">
            Zip
            <input type="text" name="zip" required style="width: 100%; padding: 8px;" />
          </label>
        </fieldset>

        <fieldset style="padding: 1rem; margin-bottom: 1rem;">
          <legend>Payment</legend>
          <label style="display:block; margin-bottom: 0.5rem;">
            Card number
            <input type="text" name="cardNumber" required style="width: 100%; padding: 8px;" />
          </label>
          <label style="display:block; margin-bottom: 0.5rem;">
            Expiration
            <input type="text" name="expiration" required style="width: 100%; padding: 8px;" />
          </label>
          <label style="display:block; margin-bottom: 0.5rem;">
            Security Code
            <input type="text" name="code" required style="width: 100%; padding: 8px;" />
          </label>
        </fieldset>

        <button type="submit" id="checkoutSubmit" style="width: 100%; padding: 12px; background-color: #396e94; color: white; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer;">
          Checkout
        </button>
      </form>
    </main>
    <footer style="text-align: center; padding: 1rem;">
      &copy;2025 ⛺ SleepOutside ⛺ WDD 330
    </footer>
    <script src="./checkout.js" type="module"></script>
  </body>
</html>
