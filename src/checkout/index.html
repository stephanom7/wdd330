<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      /* Style safety net */
      img, svg {
        max-width: 100%;
        height: auto;
      }
      .logo img, header img {
        width: 60px !important;
        height: 60px !important;
      }
      .cart svg {
        width: 25px !important;
        height: auto !important;
      }
    </style>
  </head>
  <body>
    <header class="divider">
      <div class="logo">
        <a href="../index.html">
          <img src="../images/noun_Tent_2517.svg" alt="tent logo" style="width: 60px; height: 60px;" />
        </a>
        <a href="../index.html"> Sleep<span class="highlight">Outside</span></a>
      </div>
    </header>
    <main class="divider" style="padding: 1.5rem; max-width: 600px; margin: 0 auto;">
      <h2>Review & Place your Order</h2>
      
      <form id="checkout-form" style="margin-top: 1.5rem;">
        <fieldset style="padding: 1.2rem; margin-bottom: 1.5rem; border: 1px solid #ccc; border-radius: 6px;">
          <legend style="padding: 0 5px; font-weight: bold;">Shipping Details</legend>
          <label style="display:block; margin-bottom: 0.8rem;">
            First Name
            <input type="text" name="fname" required style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" />
          </label>
          <label style="display:block; margin-bottom: 0.8rem;">
            Last Name
            <input type="text" name="lname" required style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" />
          </label>
          <label style="display:block; margin-bottom: 0.8rem;">
            Street Address
            <input type="text" name="street" required style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" />
          </label>
          <label style="display:block; margin-bottom: 0.8rem;">
            City
            <input type="text" name="city" required style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" />
          </label>
          <label style="display:block; margin-bottom: 0.8rem;">
            State
            <input type="text" name="state" required style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" />
          </label>
          <label style="display:block; margin-bottom: 0.8rem;">
            Zip Code
            <input type="text" name="zip" required style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" />
          </label>
        </fieldset>

        <fieldset style="padding: 1.2rem; margin-bottom: 1.5rem; border: 1px solid #ccc; border-radius: 6px;">
          <legend style="padding: 0 5px; font-weight: bold;">Payment Information</legend>
          <label style="display:block; margin-bottom: 0.8rem;">
            Card Number
            <input type="text" name="cardNumber" required placeholder="1234123412341234" style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" />
          </label>
          <label style="display:block; margin-bottom: 0.8rem;">
            Expiration Date
            <input type="text" name="expiration" required placeholder="MM/YY" style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" />
          </label>
          <label style="display:block; margin-bottom: 0.8rem;">
            Security Code (CVC)
            <input type="text" name="code" required placeholder="123" style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" />
          </label>
        </fieldset>

        <button type="submit" id="checkoutSubmit" style="width: 100%; padding: 12px; background-color: #525b0f; color: white; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer; font-weight: bold;">
          Place Order
        </button>
      </form>
    </main>
    <footer style="text-align: center; padding: 1rem; margin-top: 2rem;">
      &copy;2025 ⛺ SleepOutside ⛺ WDD 330
    </footer>
    <script src="./checkout.js" type="module"></script>
  </body>
</html>
